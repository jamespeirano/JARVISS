<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Group messages</title><style>body{font:18px system-ui;background:#181818;color:#eee;max-width:650px;margin:25px auto;padding:0 20px}input,textarea,button{font:inherit;box-sizing:border-box;padding:12px;margin:6px 0;width:100%;border-radius:8px;border:1px solid #666;background:#292929;color:white}article{border-bottom:1px solid #555;padding:16px 0}small{color:#aaa}p{white-space:pre-wrap}button{cursor:pointer}</style><h1>Group messages</h1><label>Board code<input id="code" autocomplete="off" placeholder="Shown in Jarvis"></label><button id="join">Read messages</button><section id="messages"></section><form id="form"><label>Your name<input id="name" maxlength="80" required></label><label>Message<textarea id="text" maxlength="2000" required></textarea></label><button>Send</button></form><p id="status" role="status"></p><script>
const $=id=>document.getElementById(id);let joined=false;
async function request(method,data){const response=await fetch('/messages',{method,headers:{'X-Board-Code':$('code').value.trim().toUpperCase(),'Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});const result=await response.json();if(!response.ok)throw Error(result.error);return result;}
async function refresh(){try{const rows=await request('GET');$('messages').replaceChildren();for(const r of rows){const a=document.createElement('article'),n=document.createElement('strong'),p=document.createElement('p'),d=document.createElement('small');n.textContent=r.name;p.textContent=r.text;d.textContent=new Date(r.at).toLocaleString();a.append(n,p,d);$('messages').append(a);}joined=true;$('status').textContent='';}catch(e){$('status').textContent=e.message;}}
$('join').onclick=refresh;$('form').onsubmit=async e=>{e.preventDefault();try{await request('POST',{name:$('name').value,text:$('text').value});$('text').value='';await refresh();}catch(e){$('status').textContent=e.message;}};setInterval(()=>{if(joined)refresh();},5000);
</script></html>
