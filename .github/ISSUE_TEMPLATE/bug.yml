name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Jarvis version and computer
      placeholder: "0.2.1; Windows 11 x64; 16 GB RAM"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use made-up locations and records. Include whether you were offline.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or error message
      description: Remove names, addresses, conversations, access codes and credentials first.
