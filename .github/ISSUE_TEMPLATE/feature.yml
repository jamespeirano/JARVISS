name: Improvement
description: Suggest a useful change.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe the need in ordinary language.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would make it easier?
      description: Mention whether the feature needs to work offline.
    validations:
      required: true
