name: Transfer verified release sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: transfer
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: b5118ec06113e3af7df400fa5979a53f87f55529
          persist-credentials: false
          path: application
      - name: Reuse public dependency sources and verify every source file
        run: python3 transfer/scripts/release-source-transfer/prepare.py application output
      - name: Upload complete sources to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/jamespeirano/JARVISS/releases/390856464 --jq '.draft')" = true
          test "$(gh api repos/jamespeirano/JARVISS/releases/390856464 --jq '.target_commitish')" = b5118ec06113e3af7df400fa5979a53f87f55529
          gh release upload v0.2.3 output/JARVISS-corresponding-source.tar.gz output/chromium-152.0.7977.78.tar.gz --repo jamespeirano/JARVISS
      - name: Verify uploaded digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/jamespeirano/JARVISS/releases/390856464 > output/release.json
          python3 transfer/scripts/release-source-transfer/verify_uploaded.py output
