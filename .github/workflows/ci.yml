name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: python -m pip install -r requirements.txt -c constraints.txt
      - run: npm ci --prefix electron
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: node electron/tests/atlas-protocol.cjs
      - run: node --test electron/tests/startup.cjs
      - run: npm run build:map --prefix electron
      - name: Check chat and voice controls
        run: |
          python -m venv .venv --system-site-packages
          node electron/tests/feedback.cjs
      - name: Check setup, background maps, pause and restart
        run: node electron/tests/setup.cjs
      - name: Check offline document reader and PDF pages
        run: node electron/tests/references.cjs
      - name: Check chat layout and voice indicator
        run: node electron/tests/smoke.cjs
      - name: Check navigation, sidebar resizing and responsive layouts
        run: node electron/tests/ui.cjs
  public-source:
    name: Public source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o "$RUNNER_TEMP/gitleaks-checksums.txt"
          python - "$RUNNER_TEMP" <<'PY'
          import hashlib, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          expected=next(line.split()[0] for line in (root/'gitleaks-checksums.txt').read_text().splitlines() if line.endswith('gitleaks_8.30.1_linux_x64.tar.gz'))
          assert hashlib.sha256((root/'gitleaks.tar.gz').read_bytes()).hexdigest()==expected
          PY
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact=100 --no-banner
      - name: Release boundaries
        run: python scripts/check_publication.py
